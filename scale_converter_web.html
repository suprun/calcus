<!doctype html>
<!-- scale converter UI v2026-06-22-15 -->
<html lang="uk" data-theme="light">
<head>
  <script async src="assets/shared/analytics.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Калькулятор масштабу</title>
  <meta name="description" content="Компактний калькулятор масштабу A:B для перерахунку реальної довжини та довжини на кресленні." />
  <link rel="icon" type="image/svg+xml" href="assets/shared/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/shared/styles.css">
  <link rel="stylesheet" href="assets/scale_converter_web/styles.css">
</head>
<body>

  <div class="app">
    <a class="home-link" href="index.html">← На головну</a>
    <header class="top">
  <span class="title-side-icon" aria-hidden="true">
    <img class="icon icon-image" src="assets/shared/icons/calculator.svg" alt="" aria-hidden="true">
  </span>

  <div class="title-block">
    <h1>Калькулятор масштабу</h1>
    <p class="sub">Реальна довжина ↔ довжина на кресленні</p>
  </div>

  <button class="btn icon" id="themeBtn" type="button" title="Змінити тему" aria-label="Змінити тему">
    <img class="icon icon-image" src="assets/shared/icons/theme.svg" alt="" aria-hidden="true">
  </button>
</header>

    <main class="panel" aria-label="Калькулятор масштабу">
      <section class="result" aria-live="polite">
        <div class="result-line">
          <div class="result-main" id="resultMain">—</div>
          <button class="btn icon" id="resultFlipBtn" type="button" title="Фліпнути запис результату" aria-label="Фліпнути запис результату">
            <img class="icon icon-image" src="assets/scale_converter_web/icons/swap.svg" alt="" aria-hidden="true">
          </button>
        </div>
        <div class="result-sub" id="resultSub"></div>
      </section>

      <section class="body">
        <div class="scale-row">
          <span class="side-icon" aria-hidden="true"><img class="icon icon-image" src="assets/scale_converter_web/icons/scale.svg" alt="" aria-hidden="true"></span>
          <div class="scale-grid">
            <div class="preset">
              <label for="preset">Масштаб</label>
              <select class="control" id="preset">
                <option value="custom">Власний</option>
                <option value="1:1">1:1</option><option value="1:2">1:2</option><option value="1:5">1:5</option><option value="1:10">1:10</option><option value="1:20">1:20</option><option value="1:25">1:25</option><option value="1:50" selected>1:50</option><option value="1:75">1:75</option><option value="1:100">1:100</option><option value="1:200">1:200</option><option value="1:250">1:250</option><option value="1:500">1:500</option><option value="1:1000">1:1000</option><option value="1:2000">1:2000</option><option value="1:5000">1:5000</option><option value="1:10000">1:10000</option><option value="2:1">2:1</option><option value="5:1">5:1</option><option value="10:1">10:1</option><option value="20:1">20:1</option><option value="35:1">35:1</option><option value="50:1">50:1</option>
              </select>
            </div>
            <div>
              <label for="scaleA">A</label>
              <div class="number-shell has-stepper scale-number">
                <input class="control number-input" id="scaleA" type="number" inputmode="decimal" step="any" min="0" value="1">
                <div class="custom-stepper">
                  <button class="step-btn up" data-step-target="scaleA" data-step-dir="up" type="button" aria-label="Збільшити A"></button>
                  <button class="step-btn down" data-step-target="scaleA" data-step-dir="down" type="button" aria-label="Зменшити A"></button>
                </div>
              </div>
            </div>
            <div class="colon">:</div>
            <div>
              <label for="scaleB">B</label>
              <div class="number-shell has-stepper scale-number">
                <input class="control number-input" id="scaleB" type="number" inputmode="decimal" step="any" min="0" value="50">
                <div class="custom-stepper">
                  <button class="step-btn up" data-step-target="scaleB" data-step-dir="up" type="button" aria-label="Збільшити B"></button>
                  <button class="step-btn down" data-step-target="scaleB" data-step-dir="down" type="button" aria-label="Зменшити B"></button>
                </div>
              </div>
            </div>
            <button class="btn icon" id="invertBtn" type="button" title="Інвертувати масштаб" aria-label="Інвертувати масштаб"><img class="icon icon-image" src="assets/scale_converter_web/icons/invert.svg" alt="" aria-hidden="true"></button>
          </div>
        </div>

        <div class="measurements">
          <div class="measure-row real" id="realRow">
            <span class="measure-icon" aria-hidden="true"><img class="icon icon-image" src="assets/scale_converter_web/icons/real.svg" alt="" aria-hidden="true"></span>
            <div class="measure-grid">
              <div class="measure-field">
                <label for="realValue">Реальна довжина</label>
                <div class="number-shell has-voice has-stepper">
                  <input class="control number-input" id="realValue" type="number" inputmode="decimal" step="any" value="10" min="0">
                  <button class="inside-btn voice-btn" data-target="real" type="button" title="Голосове введення реальної довжини" aria-label="Голосове введення реальної довжини"><img class="icon icon-image" src="assets/scale_converter_web/icons/mic.svg" alt="" aria-hidden="true"></button>
                  <div class="custom-stepper">
                    <button class="step-btn up" data-step-target="realValue" data-step-dir="up" type="button" aria-label="Збільшити реальну довжину"></button>
                    <button class="step-btn down" data-step-target="realValue" data-step-dir="down" type="button" aria-label="Зменшити реальну довжину"></button>
                  </div>
                </div>
              </div>
              <div class="unit-field">
                <label for="realUnit">Одиниці</label>
                <select class="control" id="realUnit"></select>
              </div>
            </div>
          </div>

          <div class="measure-row drawing" id="drawingRow">
            <span class="measure-icon" aria-hidden="true"><img class="icon icon-image" src="assets/scale_converter_web/icons/drawing.svg" alt="" aria-hidden="true"></span>
            <div class="measure-grid">
              <div class="measure-field">
                <label for="drawingValue">Довжина на кресленні</label>
                <div class="number-shell has-voice has-stepper">
                  <input class="control number-input" id="drawingValue" type="number" inputmode="decimal" step="any" min="0">
                  <button class="inside-btn voice-btn" data-target="drawing" type="button" title="Голосове введення довжини на кресленні" aria-label="Голосове введення довжини на кресленні"><img class="icon icon-image" src="assets/scale_converter_web/icons/mic.svg" alt="" aria-hidden="true"></button>
                  <div class="custom-stepper">
                    <button class="step-btn up" data-step-target="drawingValue" data-step-dir="up" type="button" aria-label="Збільшити довжину на кресленні"></button>
                    <button class="step-btn down" data-step-target="drawingValue" data-step-dir="down" type="button" aria-label="Зменшити довжину на кресленні"></button>
                  </div>
                </div>
              </div>
              <div class="unit-field">
                <label for="drawingUnit">Одиниці</label>
                <select class="control" id="drawingUnit"></select>
              </div>
            </div>
          </div>
        </div>

        <div class="mini-row">
          <button class="btn danger" id="clearBtn" type="button"><img class="icon icon-image" src="assets/scale_converter_web/icons/trash.svg" alt="" aria-hidden="true">Очистити</button>
          <button class="btn" id="copyLinkBtn" type="button"><img class="icon icon-image" src="assets/scale_converter_web/icons/link.svg" alt="" aria-hidden="true">URL</button>
          <button class="btn" id="copyResultBtn" type="button"><img class="icon icon-image" src="assets/shared/icons/copy.svg" alt="" aria-hidden="true">Копіювати</button>
          <button class="btn" id="swapUnitsBtn" type="button" title="Поміняти одиниці місцями"><img class="icon icon-image" src="assets/scale_converter_web/icons/swap.svg" alt="" aria-hidden="true">Одиниці</button>
        </div>
      </section>


<details id="formulaDetails" class="animated-details">
  <summary>
    <span class="details-side-icon" aria-hidden="true">
      <img class="icon icon-image" src="assets/scale_converter_web/icons/formula.svg" alt="" aria-hidden="true">
    </span>

    <span>Формула і схема</span>

    <span class="details-chevron" aria-hidden="true">
      <img class="chevron-svg icon-image" src="assets/shared/icons/chevron-down.svg" alt="" aria-hidden="true">
    </span>
  </summary>

  <div class="details-body-wrap">
    <div class="details-body">
      <div class="formula" id="formulaBox">—</div>

      <div class="bars">
        <div class="bar-row">
          <span>Реальна</span>
          <div class="track"><div class="fill" id="realBar"></div></div>
          <span id="realBarText">—</span>
        </div>

        <div class="bar-row">
          <span>Креслення</span>
          <div class="track"><div class="fill" id="drawingBar"></div></div>
          <span id="drawingBarText">—</span>
        </div>
      </div>
    </div>
  </div>
</details>
</main>
</div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/scale_converter_web/script.js"></script>
</body>
</html>
